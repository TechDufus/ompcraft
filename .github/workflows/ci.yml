name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Lua
        run: |
          sudo apt-get update && sudo apt-get install -y lua5.1
          luac5.1 -p addon/Ompcraft/Core/*.lua addon/Ompcraft/UI/*.lua addon/tests/*.lua
          lua5.1 addon/tests/run.lua
      - name: Go
        run: |
          go vet ./... && go test ./...
          GOOS=darwin go build ./...
      - name: Install script
        run: shellcheck -s sh install.sh
